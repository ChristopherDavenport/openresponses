name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26 is the floor go.work declares, since providers/gemini needs
        # it for golang.org/x/net; the root go.mod still says 1.25, which
        # the workspace cannot build under. stable is the current release.
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # Every nested module has its own go.sum; cache them all.
          cache-dependency-path: |
            go.sum
            conformance/go.sum
            providers/anthropic/go.sum
            providers/gemini/go.sum
      - name: Build
        run: make build
      - name: Root package depends on the standard library only
        run: make deps
      - name: Every first-party require is replaced with the tree
        run: make replaces
      - name: Vet (library and nested modules)
        run: make vet
      - name: Test (library and nested modules)
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Not stable: staticcheck 2026.2.1 cannot read go1.27.2's export
          # data (dominikh/go-tools#1832). Back to stable once a release
          # with the fix is out.
          go-version: "1.26.x"
          # The runner's cached 1.26 can lag a security release, which
          # govulncheck then reports.
          check-latest: true
          cache-dependency-path: |
            go.sum
            conformance/go.sum
            providers/anthropic/go.sum
            providers/gemini/go.sum
      - name: Check formatting
        run: make fmt
      - name: Check go.mod and go.sum are tidy in every module
        run: make tidy-check
      - name: staticcheck
        run: make lint
      - name: govulncheck
        run: make vuln

  compliance:
    name: Official compliance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: oven-sh/setup-bun@v2
      - name: Run the pinned openresponses compliance tests against the echo adapter
        run: make compliance BUN=bun

  # The one job that resolves a published provider's require line. Every
  # other job builds inside the workspace, where the replace answers
  # first and that line is never read; a consumer reads nothing else. A
  # version string is all the other guards check; this one compiles
  # against it. release-guard.sh did this at v0.0.11, and stopped doing
  # it at v0.0.12 when the replace arrived.
  extracted:
    name: Providers build extracted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            **/go.sum
      - name: Every provider builds against the versions it requires
        run: make extracted

  # Single required status check for branch protection; it fails if any job
  # above failed, was cancelled or was skipped.
  checks:
    name: Checks
    if: always()
    needs: [test, lint, compliance, extracted]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
