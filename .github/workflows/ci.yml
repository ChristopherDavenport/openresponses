name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25 is the floor declared in go.mod; stable is the current release.
        go: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # Every nested module has its own go.sum; cache them all.
          cache-dependency-path: |
            go.sum
            conformance/go.sum
            providers/anthropic/go.sum
            providers/gemini/go.sum
      - name: Build
        run: make build
      - name: Root package depends on the standard library only
        run: make deps
      - name: Vet (library and nested modules)
        run: make vet
      - name: Test (library and nested modules)
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            conformance/go.sum
            providers/anthropic/go.sum
            providers/gemini/go.sum
      - name: Check formatting
        run: make fmt
      - name: Check go.mod and go.sum are tidy in every module
        run: |
          make tidy
          git diff --exit-code
      - name: staticcheck
        run: make lint
      - name: govulncheck
        run: make vuln

  compliance:
    name: Official compliance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Run the pinned openresponses compliance tests against the echo adapter
        run: make compliance BUN=bun

  # Provider modules build against the local root inside the workspace, which
  # hides a provider whose go.mod requires a root version that does not carry
  # what it uses. Building them the way consumers do keeps main taggable: the
  # release workflow runs the same check, but only after the tag is pushed and
  # the version is already permanent.
  release-check:
    name: Providers build against the published root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            providers/anthropic/go.sum
            providers/gemini/go.sum
      - name: Build and test each provider outside the workspace
        run: make release-check

  # Single required status check for branch protection; it fails if any job
  # above failed, was cancelled or was skipped.
  checks:
    name: Checks
    if: always()
    needs: [test, lint, compliance, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
